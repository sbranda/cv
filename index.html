<script>
  // Capturador de errores visible en pantalla, sin necesidad de herramientas de desarrollador.
  // Si algo falla al cargar o ejecutar la app, muestra el mensaje de error en una franja roja
  // fija arriba de la pantalla, en vez de fallar en silencio.
  (function () {
    function showError(msg) {
      var existing = document.getElementById("boot-error-banner");
      if (existing) {
        existing.textContent += "\n\n" + msg;
        return;
      }
      var el = document.createElement("div");
      el.id = "boot-error-banner";
      el.style.cssText =
        "position:fixed;top:0;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fff;" +
        "padding:12px 16px;font:12px monospace;white-space:pre-wrap;word-break:break-word;" +
        "max-height:60vh;overflow:auto;border-bottom:3px solid #fecaca;";
      el.textContent = "ERROR AL CARGAR LA APP:\n\n" + msg;
      document.body.appendChild(el);
    }
    window.addEventListener("error", function (e) {
      showError((e.message || "Error desconocido") + "\n(línea " + e.lineno + ", columna " + e.colno + ")\n" + (e.filename || ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      showError("Promesa rechazada: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
    });
  })();
</script>

function InstallButton() {
  const [deferred, setDeferred] = useState(null);
  const [installed, setInstalled] = useState(false);

  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setDeferred(e); };
    const onInstalled = () => setInstalled(true);
    window.addEventListener("beforeinstallprompt", onPrompt);
    window.addEventListener("appinstalled", onInstalled);
    return () => {
      window.removeEventListener("beforeinstallprompt", onPrompt);
      window.removeEventListener("appinstalled", onInstalled);
    };
  }, []);

  if (installed || !deferred) return null;

  return (
    <button
      onClick={async () => { deferred.prompt(); await deferred.userChoice; setDeferred(null); }}
      className="inline-flex items-center gap-2 text-sm font-medium px-3.5 py-2 rounded-md border border-stone-700 text-stone-200 hover:border-stone-500 transition"
    >
      <ArrowDownToLine size={15} /> Instalar app
    </button>
  );
}

async function callClaude(prompt, apiKey) {
  if (PROXY_URL) {
    const response = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    if (!response.ok) {
      const errText = await response.text().catch(() => "");
      let detail = errText.slice(0, 300);
      try {
        const parsed = JSON.parse(errText);
        if (parsed?.error?.message) detail = parsed.error.message;
        else if (parsed?.error) detail = parsed.error;
      } catch (e) {}
      console.error("Proxy/Gemini error", response.status, errText);
      throw new Error(`(${response.status}) ${detail}`);
    }
    const data = await response.json();
    const parts = data?.candidates?.[0]?.content?.parts || [];
    const text = parts.map((p) => p.text || "").join("").trim();
    if (!text) throw new Error("La API no devolvió texto. Revisá la configuración del Worker.");
    return text;
  }

  if (!apiKey) throw new MissingApiKeyError("Falta configurar la clave de API");
  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey,
      },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: prompt }] }],
      }),
    }
  );
  if (!response.ok) {
    const errText = await response.text().catch(() => "");
    let detail = errText.slice(0, 300);
    try {
      const parsed = JSON.parse(errText);
      if (parsed?.error?.message) detail = parsed.error.message;
    } catch (e) {}
    console.error("Gemini API error", response.status, errText);
    throw new Error(`(${response.status}) ${detail}`);
  }
  const data = await response.json();
  const parts = data?.candidates?.[0]?.content?.parts || [];
  const text = parts.map((p) => p.text || "").join("").trim();
  if (!text) throw new Error("La API no devolvió texto. Revisá tu clave o el modelo configurado.");
  return text;
}

function useSwipeToDismiss(onClose, open) {
  const [dragY, setDragY] = useState(0);
  const draggingRef = useRef(false);
  const startYRef = useRef(0);

  // Cerrar con la tecla Escape, para quienes no usan mouse/dedo.
  useEffect(() => {
    if (!open) return;
    const onKeyDown = (e) => {
      if (e.key === "Escape") onClose();
    };
    document.addEventListener("keydown", onKeyDown);
    return () => document.removeEventListener("keydown", onKeyDown);
  }, [onClose, open]);

  const onPointerDown = (e) => {
    draggingRef.current = true;
    startYRef.current = e.clientY;
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!draggingRef.current) return;
    const delta = e.clientY - startYRef.current;
    if (delta > 0) setDragY(delta);
  };
  const finish = () => {
    if (!draggingRef.current) return;
    draggingRef.current = false;
    if (dragY > 110) onClose();
    setDragY(0);
  };

  return {
    cardStyle: {
      transform: dragY ? `translateY(${dragY}px)` : undefined,
      transition: draggingRef.current ? "none" : "transform 0.25s ease",
    },
    dialogProps: { role: "dialog", "aria-modal": "true" },
    handle: (
      <div
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={finish}
        onPointerCancel={finish}
        aria-hidden="true"
        className="sm:hidden flex justify-center pt-2 pb-3 -mt-6 -mx-6 mb-1 cursor-grab active:cursor-grabbing"
        style={{ touchAction: "none" }}
      >
        <div className="w-10 h-1 rounded-full bg-stone-700" />
      </div>
    ),
  };
}

function SectionOrderList({ order, accent, onReorder }) {
  const [dragIndex, setDragIndex] = useState(null);
  const [overIndex, setOverIndex] = useState(null);
  const itemRefs = useRef([]);

  const handlePointerDown = (index) => (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    setDragIndex(index);
    setOverIndex(index);
  };

  const handlePointerMove = (e) => {
    if (dragIndex === null) return;
    const y = e.clientY;
    itemRefs.current.forEach((el, i) => {
      if (!el) return;
      const rect = el.getBoundingClientRect();
      if (y >= rect.top && y <= rect.bottom) setOverIndex(i);
    });
  };

  const finishDrag = () => {
    if (dragIndex !== null && overIndex !== null && dragIndex !== overIndex) {
      const newOrder = [...order];
      const [moved] = newOrder.splice(dragIndex, 1);
      newOrder.splice(overIndex, 0, moved);
      onReorder(newOrder);
    }
    setDragIndex(null);
    setOverIndex(null);
  };

  const moveByKeyboard = (index, direction) => {
    const target = index + direction;
    if (target < 0 || target >= order.length) return;
    const newOrder = [...order];
    [newOrder[index], newOrder[target]] = [newOrder[target], newOrder[index]];
    onReorder(newOrder);
  };

  return (
    <div role="list" aria-label="Orden de las secciones del CV">
      {order.map((key, i) => (
        <div
          key={key}
          role="listitem"
          ref={(el) => (itemRefs.current[i] = el)}
          className="flex items-center gap-2 px-3 py-2 rounded-md border mb-1.5 bg-stone-800/40 transition"
          style={{
            borderColor: dragIndex === i ? accent : overIndex === i && dragIndex !== null ? `${accent}88` : "#3f3a35",
            opacity: dragIndex === i ? 0.5 : 1,
          }}
        >
          <button
            onPointerDown={handlePointerDown(i)}
            onPointerMove={handlePointerMove}
            onPointerUp={finishDrag}
            onPointerCancel={finishDrag}
            aria-label={`Arrastrar para reordenar "${SECTION_LABELS[key] || key}"`}
            className="cursor-grab active:cursor-grabbing text-stone-500 shrink-0"
            style={{ touchAction: "none" }}
          >
            <GripVertical size={15} aria-hidden="true" />
          </button>
          <span className="text-[12.5px] text-stone-300 flex-1">{SECTION_LABELS[key] || key}</span>
          <div className="flex items-center gap-0.5 shrink-0">
            <button
              onClick={() => moveByKeyboard(i, -1)}
              disabled={i === 0}
              aria-label={`Subir "${SECTION_LABELS[key] || key}"`}
              className="p-1 rounded text-stone-500 hover:text-white hover:bg-stone-700 transition disabled:opacity-25 disabled:hover:bg-transparent disabled:hover:text-stone-500"
            >
              <ChevronUp size={14} aria-hidden="true" />
            </button>
            <button
              onClick={() => moveByKeyboard(i, 1)}
              disabled={i === order.length - 1}
              aria-label={`Bajar "${SECTION_LABELS[key] || key}"`}
              className="p-1 rounded text-stone-500 hover:text-white hover:bg-stone-700 transition disabled:opacity-25 disabled:hover:bg-transparent disabled:hover:text-stone-500"
            >
              <ChevronDown size={14} aria-hidden="true" />
            </button>
          </div>
        </div>
      ))}
    </div>
  );
}

function PlainTextModal({ open, onClose, text, accent, fileName }) {
  const { cardStyle, handle, dialogProps } = useSwipeToDismiss(onClose, open);
  if (!open) return null;
  const handleDownload = () => {
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${fileName || "CV"}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  return (
    <div className="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-6 no-print">
      <div {...dialogProps} style={cardStyle} className="bg-stone-900 border border-stone-800 rounded-t-2xl sm:rounded-lg w-full max-w-lg p-6 max-h-[85vh] overflow-y-auto flex flex-col">

          <h2 className="font-display text-xl">Texto plano para ATS</h2>
          <button onClick={onClose} aria-label="Cerrar" className="text-stone-500 hover:text-white transition">
            <X size={20} aria-hidden="true" />
          </button>
        </div>
        <p className="text-[12px] text-stone-500 mb-3 leading-relaxed">
          Sin negritas, viñetas ni formato — pensado para pegar directo en los formularios de texto de
          sistemas de postulación (ATS) que no aceptan archivos con diseño.
        </p>
        <textarea spellCheck="true"
          readOnly
          value={text}
          onClick={(e) => e.target.select()}
          className="w-full flex-1 min-h-[360px] bg-stone-800/60 border border-stone-700 rounded-md px-3 py-2.5 text-[12.5px] text-stone-100 font-mono leading-relaxed resize-none focus:outline-none"
        />
        <div className="flex gap-2 mt-3">
          <button
            onClick={() => navigator.clipboard?.writeText(text)}
            className="flex-1 inline-flex items-center justify-center gap-2 text-sm font-medium px-4 py-2.5 rounded-md text-stone-950 transition hover:opacity-90"
            style={{ background: accent }}
          >
            <Copy size={15} /> Copiar todo
          </button>
          <button
            onClick={handleDownload}
            className="flex-1 inline-flex items-center justify-center gap-2 text-sm font-medium px-4 py-2.5 rounded-md border border-stone-700 text-stone-200 hover:border-stone-500 transition"
          >
            <FileDown size={15} /> Descargar .txt
          </button>
        </div>
      </div>
    </div>
  );
}

function CVBuilder() {
  const [profiles, setProfiles] = useState(() => loadProfiles().profiles);
  const [activeProfileId, setActiveProfileId] = useState(() => loadProfiles().activeProfileId);
  const [profilesOpen, setProfilesOpen] = useState(false);

  const activeProfile = profiles.find((p) => p.id === activeProfileId) || profiles[0];
  const data = activeProfile.data;
  const setData = (updater) => {
    setProfiles((prev) =>
      prev.map((p) =>
        p.id === activeProfile.id
          ? { ...p, data: typeof updater === "function" ? updater(p.data) : updater }
          : p
      )
    );
  };

  // ---- Undo / redo (historial por perfil; se reinicia al cambiar de perfil, excluye la foto) ----
  const historyRef = useRef({ stack: [], index: -1, skip: false });
  const [historyVersion, setHistoryVersion] = useState(0);

  const snapshotData = (d) => {
    const { foto, ...rest } = d;
    return JSON.parse(JSON.stringify(rest));
  };

  useEffect(() => {
    historyRef.current = { stack: [snapshotData(activeProfile.data)], index: 0, skip: false };
    setHistoryVersion((v) => v + 1);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeProfileId]);

  useEffect(() => {
    const h = historyRef.current;
    if (h.skip) {
      h.skip = false;
      return;
    }
    const timeout = setTimeout(() => {
      const snap = snapshotData(data);
      const newStack = h.stack.slice(0, h.index + 1);
      const last = newStack[newStack.length - 1];
      if (last && JSON.stringify(last) === JSON.stringify(snap)) return;
      newStack.push(snap);
      if (newStack.length > 40) newStack.shift();
      historyRef.current = { stack: newStack, index: newStack.length - 1, skip: false };
      setHistoryVersion((v) => v + 1);
    }, 700);
    return () => clearTimeout(timeout);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data]);

  const canUndo = historyRef.current.index > 0;
  const canRedo = historyRef.current.index < historyRef.current.stack.length - 1;

  const undo = () => {
    const h = historyRef.current;
    if (h.index <= 0) return;
    h.index -= 1;
    h.skip = true;
    const snap = h.stack[h.index];
    setData((d) => ({ ...d, ...snap }));
    setHistoryVersion((v) => v + 1);
  };

  const redo = () => {
    const h = historyRef.current;
    if (h.index >= h.stack.length - 1) return;
    h.index += 1;
    h.skip = true;
    const snap = h.stack[h.index];
    setData((d) => ({ ...d, ...snap }));
    setHistoryVersion((v) => v + 1);
  };

  const addProfile = () => {
    const id = crypto.randomUUID();
    setProfiles((prev) => [...prev, { id, nombre: `Perfil ${prev.length + 1}`, data: { ...initialState } }]);
    setActiveProfileId(id);
  };

  const duplicateProfile = (id) => {
    const source = profiles.find((p) => p.id === id);
    if (!source) return;
    const newId = crypto.randomUUID();
    setProfiles((prev) => {
      const idx = prev.findIndex((p) => p.id === id);
      const copy = { id: newId, nombre: `${source.nombre} (copia)`, data: JSON.parse(JSON.stringify(source.data)) };
      const next = [...prev];
      next.splice(idx + 1, 0, copy);
      return next;
    });
    setActiveProfileId(newId);
  };

  const [translatingId, setTranslatingId] = useState(null);

  const translateProfileToEnglish = async (id) => {
    if (!apiKey && !PROXY_URL) { setProfilesOpen(false); setSettingsOpen(true); return; }
    const source = profiles.find((p) => p.id === id);
    if (!source) return;
    setTranslatingId(id);
    try {
      const d = source.data;
      const payload = {
        puesto: d.puesto,
        ubicacion: d.ubicacion,
        resumen: d.resumen,
        experiencia: d.experiencia.map((e) => ({ puesto: e.puesto, descripcion: e.descripcion })),
        educacion: d.educacion.map((e) => ({ titulo: e.titulo })),
        habilidades: d.habilidades,
        proyectos: d.proyectos.map((p) => ({ nombre: p.nombre, descripcion: p.descripcion })),
        becas: d.becas.map((b) => ({ nombre: b.nombre })),
        logros: d.logros.map((l) => ({ descripcion: l.descripcion })),
      };
      const prompt = `Traducí al inglés profesional (convenciones de currículum en inglés de EE.UU.) el siguiente contenido de un currículum, representado en JSON. Reglas:
- Traducí: puesto, resumen, descripciones de experiencia, títulos académicos, habilidades, nombres y descripciones de proyectos, nombres de becas/reconocimientos, descripciones de logros.
- La "ubicacion" traducila solo si la ciudad/país tiene un nombre común en inglés (ej. "Ciudad de México" -> "Mexico City"); si no, dejala igual.
- Mantené el mismo orden y la misma cantidad de elementos en cada array que el original.
- Devolvé SOLO un objeto JSON válido con exactamente la misma estructura de claves que el original, sin texto extra ni bloques de código.

JSON original:
"""${JSON.stringify(payload)}"""`;
      const result = await callClaude(prompt, apiKey);
      const cleaned = result.replace(/^```json\s*|^```\s*|```\s*$/g, "").trim();
      const t = JSON.parse(cleaned);

      const newData = {
        ...JSON.parse(JSON.stringify(d)),
        puesto: t.puesto ?? d.puesto,
        ubicacion: t.ubicacion ?? d.ubicacion,
        resumen: t.resumen ?? d.resumen,
        habilidades: t.habilidades ?? d.habilidades,
        experiencia: d.experiencia.map((exp, i) => ({
          ...exp,
          puesto: t.experiencia?.[i]?.puesto ?? exp.puesto,
          descripcion: t.experiencia?.[i]?.descripcion ?? exp.descripcion,
        })),
        educacion: d.educacion.map((edu, i) => ({
          ...edu,
          titulo: t.educacion?.[i]?.titulo ?? edu.titulo,
        })),
        proyectos: d.proyectos.map((p, i) => ({
          ...p,
          nombre: t.proyectos?.[i]?.nombre ?? p.nombre,
          descripcion: t.proyectos?.[i]?.descripcion ?? p.descripcion,
        })),
        becas: d.becas.map((b, i) => ({
          ...b,
          nombre: t.becas?.[i]?.nombre ?? b.nombre,
        })),
        logros: d.logros.map((l, i) => ({
          ...l,
          descripcion: t.logros?.[i]?.descripcion ?? l.descripcion,
        })),
      };

      const newId = crypto.randomUUID();
      setProfiles((prev) => {
        const idx = prev.findIndex((p) => p.id === id);
        const copy = { id: newId, nombre: `${source.nombre} (English)`, data: newData };
        const next = [...prev];
        next.splice(idx + 1, 0, copy);
        return next;
      });
      setActiveProfileId(newId);
    } catch (e) {
      console.error(e);
      alert("No se pudo traducir el perfil: " + e.message);
    } finally {
      setTranslatingId(null);
    }
  };

  const removeProfile = (id) => {
    if (profiles.length <= 1) return;
    const idx = profiles.findIndex((p) => p.id === id);
    const next = profiles.filter((p) => p.id !== id);
    setProfiles(next);
    if (activeProfileId === id) {
      setActiveProfileId(next[Math.max(0, idx - 1)]?.id || next[0].id);
    }
  };

  const clearForm = () => {
    const ok = window.confirm(
      "¿Vaciar todo el formulario de este perfil? Se borran todos los datos cargados. Podés deshacerlo con el botón ↶ si te arrepentís."
    );
    if (!ok) return;
    setData({ ...initialState });
  };

  const exportBackup = () => {
    const payload = { profiles, activeProfileId, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const fecha = new Date().toISOString().slice(0, 10);
    a.download = `haztucv-respaldo-${fecha}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.profiles) || parsed.profiles.length === 0) {
          throw new Error("Formato inválido");
        }
        const ok = window.confirm(
          `Este archivo tiene ${parsed.profiles.length} perfil(es). ¿Restaurar y REEMPLAZAR todos tus perfiles actuales con los del archivo? Esta acción no se puede deshacer.`
        );
        if (!ok) return;
        const restored = parsed.profiles.map((p) =>
          normalizeProfile({
            id: p.id || crypto.randomUUID(),
            nombre: p.nombre || "Perfil restaurado",
            data: p.data || {},
          })
        );
        setProfiles(restored);
        setActiveProfileId(
          restored.find((p) => p.id === parsed.activeProfileId)?.id || restored[0].id
        );
      } catch (e) {
        alert("No se pudo leer el archivo. Asegurate de elegir un respaldo válido generado por HazTuCV.");
      }
    };
    reader.readAsText(file);
  };

  const renameProfile = (id, nombre) => {
    setProfiles((prev) => prev.map((p) => (p.id === id ? { ...p, nombre } : p)));
  };

  const [loadingField, setLoadingField] = useState(null);
  const [galleryOpen, setGalleryOpen] = useState(false);
  const [compareOpen, setCompareOpen] = useState(false);
  const [cartaOpen, setCartaOpen] = useState(false);
  const [cartaGenerating, setCartaGenerating] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [apiKey, setApiKey] = useState(() => {
    try { return localStorage.getItem(API_KEY_STORAGE) || HARDCODED_API_KEY; } catch (e) { return HARDCODED_API_KEY; }
  });
  const previewRef = useRef(null);
  const editorSectionRef = useRef(null);

      setTimeout(() => {

          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";

      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map((it) => it.str).join(" ") + "\n";

      return text;

  const [plainTextOpen, setPlainTextOpen] = useState(false);

  const buildPlainText = () => {
    const lines = [];
    lines.push(data.nombre || "Tu nombre");
    if (data.puesto) lines.push(data.puesto);
    const contact = [data.email, data.telefono, data.ubicacion, data.linkedin].filter(Boolean);
    if (contact.length) lines.push(contact.join(" | "));
    lines.push("");

    const addResumen = () => {
      if (!data.resumen) return;
      lines.push("PERFIL");
      lines.push(data.resumen);
      lines.push("");
    };

    const addExperiencia = () => {
      const items = data.experiencia.filter((e) => e.puesto || e.empresa);
      if (!items.length) return;
      lines.push("EXPERIENCIA");
      items.forEach((exp) => {
        const header = [exp.puesto, exp.empresa].filter(Boolean).join(" - ") + (exp.periodo ? ` (${exp.periodo})` : "");
        lines.push(header);
        if (exp.descripcion) {
          exp.descripcion
            .split("\n")
            .map((l) => l.trim())
            .filter(Boolean)
            .forEach((line) => lines.push("- " + line.replace(/^[-•]\s*/, "")));
        }
        lines.push("");
      });
    };

    const addEducacion = () => {
      const items = data.educacion.filter((e) => e.titulo || e.institucion);
      if (!items.length) return;
      lines.push("EDUCACIÓN");
      items.forEach((edu) => {
        const header = [edu.titulo, edu.institucion].filter(Boolean).join(" - ") + (edu.periodo ? ` (${edu.periodo})` : "");
        lines.push(header);
      });
      lines.push("");
    };

    const addHabilidades = () => {
      if (!data.habilidades) return;
      lines.push("HABILIDADES");
      lines.push(data.habilidades);
      lines.push("");
    };

    const sectionFns = { resumen: addResumen, experiencia: addExperiencia, educacion: addEducacion, habilidades: addHabilidades };
    (data.ordenSecciones || DEFAULT_SECTION_ORDER).forEach((key) => sectionFns[key]?.());

    if (data.seccionesOpcionales?.proyectos) {
      const items = data.proyectos.filter((p) => p.nombre);
      if (items.length) {
        lines.push("PROYECTOS");
        items.forEach((p) => {
          lines.push([p.nombre, p.stack].filter(Boolean).join(" - "));
          if (p.descripcion) lines.push(p.descripcion);
        });
        lines.push("");
      }
    }
    if (data.seccionesOpcionales?.publicaciones) {
      const items = data.publicaciones.filter((p) => p.titulo);
      if (items.length) {
        lines.push("PUBLICACIONES");
        items.forEach((p) => lines.push([p.titulo, p.revista, p.anio && `(${p.anio})`].filter(Boolean).join(" - ")));
        lines.push("");
      }
    }
    if (data.seccionesOpcionales?.becas) {
      const items = data.becas.filter((b) => b.nombre);
      if (items.length) {
        lines.push("BECAS Y RECONOCIMIENTOS");
        items.forEach((b) => lines.push([b.nombre, b.entidad, b.anio && `(${b.anio})`].filter(Boolean).join(" - ")));
        lines.push("");
      }
    }
    if (data.seccionesOpcionales?.logros) {
      const items = data.logros.filter((l) => l.metrica || l.descripcion);
      if (items.length) {
        lines.push("LOGROS DESTACADOS");
        items.forEach((l) => lines.push([l.metrica, l.descripcion].filter(Boolean).join(" - ")));
        lines.push("");
      }
    }

    if (data.seccionesOpcionales?.informacionAdicional && data.informacionAdicional) {
      lines.push("INFORMACIÓN ADICIONAL");
      lines.push(data.informacionAdicional);
      lines.push("");
    }

    return lines.join("\n").trim();

  const [exportingDocx, setExportingDocx] = useState(false);

  const ensureDocxLib = () => {

    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js";
      script.onload = () => resolve();
      script.onerror = () => reject(new Error("No se pudo cargar el generador de Word."));
      document.head.appendChild(script);
    });
  };

  const handleExportDocx = async () => {
    setExportingDocx(true);

      const accentHex = (data.accent || "#2F6F5E").replace("#", "");

      children.push(

                new TextRun({ text: exp.periodo ? `   (${exp.periodo})` : "", size: 19, italics: true, color: "777777" }),

            })

          if (exp.descripcion) {
            exp.descripcion

              .map((l) => l.trim())
              .filter(Boolean)
              .forEach((line) => {
                children.push(

                    text: line.replace(/^[-•]\s*/, ""),

          }
        });
      };

      const addEducacion = () => {
        const items = data.educacion.filter((e) => e.titulo || e.institucion);

        children.push(heading("Educación"));
        items.forEach((edu) => {
          children.push(
            new Paragraph({
              children: [
                new TextRun({ text: edu.titulo || "", bold: true, size: 22 }),
                new TextRun({ text: edu.institucion ? `   ·   ${edu.institucion}` : "", size: 22 }),
                new TextRun({ text: edu.periodo ? `   (${edu.periodo})` : "", size: 19, italics: true, color: "777777" }),
              ],
              spacing: { before: 100 },
            })
          );
        });
      };

      const addHabilidades = () => {
        if (!data.habilidades) return;
        children.push(heading("Habilidades"));
        children.push(new Paragraph({ children: [new TextRun({ text: data.habilidades, size: 22 })] }));
      };

      const docxSectionFns = { resumen: addResumen, experiencia: addExperiencia, educacion: addEducacion, habilidades: addHabilidades };
      (data.ordenSecciones || DEFAULT_SECTION_ORDER).forEach((key) => docxSectionFns[key]?.());

      if (data.seccionesOpcionales?.proyectos) {
        const items = data.proyectos.filter((p) => p.nombre);
        if (items.length) {
          children.push(heading("Proyectos"));
          items.forEach((p) => {
            children.push(
              new Paragraph({
                children: [
                  new TextRun({ text: p.nombre, bold: true, size: 22 }),
                  new TextRun({ text: p.stack ? `   ·   ${p.stack}` : "", size: 19, color: "777777" }),
                ],
                spacing: { before: 100 },
              })
            );
            if (p.descripcion) children.push(new Paragraph({ children: [new TextRun({ text: p.descripcion, size: 22 })] }));
          });
        }
      }

      if (data.seccionesOpcionales?.publicaciones) {
        const items = data.publicaciones.filter((p) => p.titulo);
        if (items.length) {
          children.push(heading("Publicaciones"));
          items.forEach((p) => {
            const parts = [p.titulo, p.revista, p.anio && `(${p.anio})`].filter(Boolean).join("   ·   ");
            children.push(new Paragraph({ children: [new TextRun({ text: parts, size: 22 })], spacing: { before: 60 } }));
          });
        }
      }

      if (data.seccionesOpcionales?.becas) {
        const items = data.becas.filter((b) => b.nombre);
        if (items.length) {
          children.push(heading("Becas y reconocimientos"));
          items.forEach((b) => {
            const parts = [b.nombre, b.entidad, b.anio && `(${b.anio})`].filter(Boolean).join("   ·   ");
            children.push(new Paragraph({ children: [new TextRun({ text: parts, size: 22 })], spacing: { before: 60 } }));
          });
        }
      }

      if (data.seccionesOpcionales?.logros) {
        const items = data.logros.filter((l) => l.metrica || l.descripcion);
        if (items.length) {
          children.push(heading("Logros destacados"));
          items.forEach((l) => {
            const parts = [l.metrica, l.descripcion].filter(Boolean).join("  —  ");
            children.push(new Paragraph({ children: [new TextRun({ text: parts, size: 22 })], spacing: { before: 60 } }));
          });
        }
      }

      if (data.seccionesOpcionales?.informacionAdicional && data.informacionAdicional) {
        children.push(heading("Información adicional"));
        children.push(new Paragraph({ children: [new TextRun({ text: data.informacionAdicional, size: 22 })] }));
      }

      const doc = new Document({ sections: [{ properties: {}, children }] });
      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${buildFileName()}.docx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error(err);
      alert("No se pudo generar el Word. Probá de nuevo en unos segundos.");

        .font-display { font-family: ${TYPO_PRESETS[data.tipografia].display} !important; }
        .font-sans { font-family: ${TYPO_PRESETS[data.tipografia].body} !important; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        input:focus, textarea:focus { border-color: ${accent} !important; box-shadow: 0 0 0 2px ${accent}33; }
        /* En iOS Safari, cualquier input con letra menor a 16px dispara un zoom
           automático al tocarlo. Forzamos 16px solo en pantallas chicas para
           evitarlo, sin agrandar la letra en escritorio. */
        @media (max-width: 767px) {
          input,
          textarea,
          select {
            font-size: 16px !important;
          }
        }
        @media print {
          .no-print { display: none !important; }
          .print-page { box-shadow: none !important; margin: 0 !important; width: 100% !important; min-height: 0 !important; }
          html, body { background: white !important; min-height: 0 !important; height: auto !important; }
          * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
        }
        /* Para personas sensibles al movimiento (mareos, migrañas, trastornos
           vestibulares): si el sistema operativo tiene "reducir movimiento"
           activado, quitamos animaciones y transiciones no esenciales. */
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
            scroll-behavior: auto !important;
          }
        }
        /* Foco visible y consistente para navegación por teclado, en toda la app. */
        button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
          outline: 2px solid ${accent};
          outline-offset: 2px;

        /* Modo claro del editor. En vez de reescribir cada elemento uno por uno,
           anulamos las clases de color oscuro de Tailwind ya existentes dentro

        .light-mode .editor-panel { background: #ffffff; }

        .light-mode .editor-panel [class~="text-stone-100"] { color: #1c1917 !important; }

        .light-mode .editor-panel [class~="text-stone-500"],
        .light-mode .editor-panel [class~="text-stone-700"] { color: #78716c !important; }

        .light-mode .editor-panel [class~="hover:border-stone-500"]:hover { border-color: #a8a29e !important; }
      `}</style>

                    <X size={15} aria-hidden="true" />
                  </button>
                </div>
              </div>
              {data.publicaciones.map((p) => (
                <div key={p.id} className="mb-3 flex items-start gap-2">
                  <div className="flex-1">
                    <Field label="Título">
                      <input spellCheck="true" className={inputClass} value={p.titulo} onChange={(e) => publicacionesH.update(p.id, { titulo: e.target.value })} placeholder="Título del artículo o paper" />
                    </Field>

                      <Field label="Revista / conferencia">
                        <input spellCheck="true" className={inputClass} value={p.revista} onChange={(e) => publicacionesH.update(p.id, { revista: e.target.value })} placeholder="Revista Latinoamericana de..." />
                      </Field>
                      <Field label="Año">
                        <input spellCheck="true" className={inputClass} value={p.anio} onChange={(e) => publicacionesH.update(p.id, { anio: e.target.value })} placeholder="2023" />
                      </Field>
                    </div>
                  </div>
                  {data.publicaciones.length > 1 && (
                    <button onClick={() => publicacionesH.remove(p.id)} className="text-stone-600 hover:text-red-400 transition mt-6">
                      <Trash2 size={14} />
                    </button>
                  )}
                </div>
              ))}
            </section>
          )}

          {data.seccionesOpcionales?.becas && (
            <section className="mb-8">
              <div className="flex items-center justify-between mb-3">
                <h2 className="font-mono text-[11px] uppercase tracking-widest text-white flex items-center gap-2">
                  <span className="w-4 h-px bg-stone-700" /> Becas y reconocimientos <span className="text-stone-600 normal-case">· Académico</span>
                </h2>
                <div className="flex items-center gap-3">

                  </button>
                  <button
                    onClick={() => update({ seccionesOpcionales: { ...data.seccionesOpcionales, becas: false } })}
                    className="text-stone-500 hover:text-red-400 transition"
                    title="Ocultar sección"
                    aria-label="Ocultar sección"
                  >
                    <X size={15} aria-hidden="true" />
                  </button>
                </div>
              </div>
              {data.becas.map((b) => (
                <div key={b.id} className="mb-3 flex items-start gap-2">
                  <div className="flex-1">
                    <Field label="Nombre">
                      <input spellCheck="true" className={inputClass} value={b.nombre} onChange={(e) => becasH.update(b.id, { nombre: e.target.value })} placeholder="Beca de excelencia académica" />
                    </Field>
                    <div className="grid grid-cols-2 gap-x-3">
                      <Field label="Entidad">
                        <input spellCheck="true" className={inputClass} value={b.entidad} onChange={(e) => becasH.update(b.id, { entidad: e.target.value })} placeholder="CONACYT" />
                      </Field>
                      <Field label="Año">
                        <input spellCheck="true" className={inputClass} value={b.anio} onChange={(e) => becasH.update(b.id, { anio: e.target.value })} placeholder="2021" />
                      </Field>
                    </div>

                  {data.becas.length > 1 && (
                    <button onClick={() => becasH.remove(b.id)} className="text-stone-600 hover:text-red-400 transition mt-6">

          {data.seccionesOpcionales?.logros && (
            <section>
              <div className="flex items-center justify-between mb-3">

                </h2>
                <div className="flex items-center gap-3">
                  <button onClick={logrosH.add} className="text-stone-400 hover:text-white transition" title="Agregar logro" aria-label="Agregar logro">
                    <Plus size={16} aria-hidden="true" />
                  </button>
                  <button
                    onClick={() => update({ seccionesOpcionales: { ...data.seccionesOpcionales, logros: false } })}
                    className="text-stone-500 hover:text-red-400 transition"
                    title="Ocultar sección"
                    aria-label="Ocultar sección"

                    <X size={15} aria-hidden="true" />

                      <Trash2 size={14} />

          {data.seccionesOpcionales?.informacionAdicional && (
            <section className="mt-6 mb-8">

                </h2>
                <button
                  onClick={() => update({ seccionesOpcionales: { ...data.seccionesOpcionales, informacionAdicional: false } })}
                  className="text-stone-500 hover:text-red-400 transition"
                  title="Ocultar sección"
                  aria-label="Ocultar sección"

                  <X size={15} aria-hidden="true" />

              </div>
              <Field label="Texto libre">
                <textarea spellCheck="true"
                  className={inputClass + " min-h-[80px] resize-none"}
                  value={data.informacionAdicional}
                  onChange={(e) => update({ informacionAdicional: e.target.value })}
                  placeholder="Cualquier información que quieras agregar — disponibilidad, licencia de conducir, idiomas adicionales, etc."
                />
              </Field>
            </section>
          )}
        </div>

        {/* Preview */}
        <div className="bg-stone-900 px-6 py-8 flex justify-center print:bg-white print:p-0">
          <div
            ref={previewRef}
            className="w-full flex justify-center"
            style={{ zoom: DENSITY_SCALE[data.densidad] }}
          >
            <div className="relative w-full max-w-[600px]">
              <PreviewComponent data={data} accent={accent} />
              {pageCount > 1 && (
                <div
                  className="absolute left-0 right-0 pointer-events-none no-print"
                  style={{ top: PAGE_HEIGHT_PX / PRINT_WIDTH_CORRECTION / DENSITY_SCALE[data.densidad] }}
                  aria-hidden="true"
                >
                  <div className="border-t-2 border-dashed" style={{ borderColor: "#f59e0b" }} />
                  <span className="absolute right-1 -top-[9px] bg-amber-500 text-stone-950 text-[9px] font-mono font-medium px-1.5 py-0.5 rounded-sm whitespace-nowrap">
                    Fin de página 1 (estimado)
                  </span>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>

      <p className="no-print text-center text-[11px] text-stone-600 py-6 px-4">
        Desarrollado por <span className="text-stone-400">@sebranda</span>
      </p>

      {showBackToTop && (
        <button
          onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
          title="Volver arriba"
          aria-label="Volver arriba"
          className="lg:hidden no-print fixed right-4 bottom-24 z-30 w-11 h-11 rounded-full flex items-center justify-center shadow-lg transition hover:opacity-90"
          style={{ background: accent }}
        >
          <ArrowUp size={18} className="text-stone-950" aria-hidden="true" />
        </button>
      )}

      <div className="lg:hidden no-print fixed bottom-0 left-0 right-0 z-30 bg-stone-950/95 backdrop-blur border-t border-stone-800 px-4 py-3">
        <button
          onClick={handlePrint}
          className="w-full inline-flex items-center justify-center gap-2 text-sm font-semibold px-4 py-3 rounded-md text-stone-950 transition hover:opacity-90"
          style={{ background: accent }}
        >
          <Download size={16} /> Descargar PDF
        </button>
      </div>
    </div>
  );
}

function normalizeOrder(value) {
  if (Array.isArray(value) && value.length) return value;
  if (value === "educacion-primero") return ["resumen", "educacion", "experiencia", "habilidades"];
  return DEFAULT_SECTION_ORDER;
}

function normalizeProfile(p) {
  return { ...p, data: { ...initialState, ...p.data, ordenSecciones: normalizeOrder(p.data?.ordenSecciones) } };
}

function loadProfiles() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && Array.isArray(parsed.profiles) && parsed.profiles.length) {
        return { ...parsed, profiles: parsed.profiles.map(normalizeProfile) };
      }
    }
  } catch (e) {}
  // Migration: try the old single-profile format
  try {
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if (legacy) {
      const legacyData = JSON.parse(legacy);
      return {
        profiles: [normalizeProfile({ id: "profile-1", nombre: "Perfil 1", data: { ...initialState, ...legacyData } })],
        activeProfileId: "profile-1",
      };
    }
  } catch (e) {}
  return {
    profiles: [{ id: "profile-1", nombre: "Perfil 1", data: initialState }],
    activeProfileId: "profile-1",
  };
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<CVBuilder />);
} catch (e) {
  console.error(e);
  window.dispatchEvent(new ErrorEvent("error", { message: "Error al renderizar: " + e.message }));
}
