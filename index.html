<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Constructor de Currículum</title>
<meta name="description" content="Crea y edita tu currículum con vista previa en vivo, plantillas y ayuda de IA." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2F6F5E" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mi CV" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  html, body { background: #0c0a09; }

    body { background: white !important; }

</style>
</head>
<body class="font-sans">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* ---------- inline icon set (replaces lucide-react, no bundler needed) ---------- */
function Icon({ children, size = 16, className = "" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      {children}
    </svg>
  );
}
const Plus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14" /></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z" /></Icon>;
const Sparkles = (p) => <Icon {...p}><path d="m12 3-1.9 4.6L5.5 9.5l4.6 1.9L12 16l1.9-4.6 4.6-1.9-4.6-1.9L12 3Z" /><path d="M5 3v4M3 5h4M19 17v4M17 19h4" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></Icon>;
const Loader2 = (p) => <Icon {...p}><path d="M21 12a9 9 0 1 1-6.219-8.56" /></Icon>;
const Mail = (p) => <Icon {...p}><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 6-10 7L2 6" /></Icon>;
const Phone = (p) => <Icon {...p}><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.7 2Z" /></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></Icon>;
const Linkedin = (p) => <Icon {...p}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4V8h4v1.5A6 6 0 0 1 16 8Z" /><rect x="2" y="9" width="4" height="12" /><circle cx="4" cy="4" r="2" /></Icon>;
const GripVertical = (p) => <Icon {...p}><circle cx="9" cy="5" r="1" /><circle cx="9" cy="12" r="1" /><circle cx="9" cy="19" r="1" /><circle cx="15" cy="5" r="1" /><circle cx="15" cy="12" r="1" /><circle cx="15" cy="19" r="1" /></Icon>;
const LayoutTemplate = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></Icon>;
const X = (p) => <Icon {...p}><path d="M18 6 6 18M6 6l12 12" /></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5" /></Icon>;
const ArrowDownToLine = (p) => <Icon {...p}><path d="M12 3v12m0 0 4-4m-4 4-4-4" /><path d="M4 19h16" /></Icon>;

/* ---------- data ---------- */
const ACCENTS = [
  { name: "Bosque", value: "#2F6F5E" },
  { name: "Tinta", value: "#2B3A67" },
  { name: "Ciruela", value: "#5B3758" },
  { name: "Óxido", value: "#8A3B2E" },
];

const TEMPLATES = [
  { id: "clasico", name: "Clásico", desc: "Encabezado editorial, una columna" },
  { id: "moderno", name: "Moderno", desc: "Barra lateral oscura con datos y skills" },
  { id: "minimalista", name: "Minimalista", desc: "Tipografía limpia, mucho espacio en blanco" },
  { id: "ejecutivo", name: "Ejecutivo", desc: "Encabezado centrado, dos columnas" },
  { id: "corporativo", name: "Corporativo", desc: "Formal y sobrio, ideal para sistemas ATS" },
  { id: "compacto", name: "Compacto", desc: "Estilo línea de tiempo, cabe más contenido" },
  { id: "creativo", name: "Creativo", desc: "Encabezado en bloque de color, más visual" },
];

const emptyExperience = () => ({
  id: crypto.randomUUID(), puesto: "", empresa: "", periodo: "", descripcion: "",
});
const emptyEducation = () => ({
  id: crypto.randomUUID(), titulo: "", institucion: "", periodo: "",
});

const STORAGE_KEY = "cv-builder-data-v1";

function loadInitialState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return {
    nombre: "", puesto: "", email: "", telefono: "", ubicacion: "", linkedin: "",
    resumen: "", experiencia: [emptyExperience()], educacion: [emptyEducation()],
    habilidades: "", accent: ACCENTS[0].value, template: "clasico",
  };
}

/* NOTE: this standalone build uses localStorage (unlike the in-chat artifact preview,
   which cannot use browser storage). This lets your draft survive a refresh once installed. */

async function callClaude(prompt) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await response.json();
  return data.content.map((b) => (b.type === "text" ? b.text : "")).join("\n").trim();
}

function Field({ label, children }) {
  return (
    <label className="block mb-3">
      <span className="block text-[11px] font-mono uppercase tracking-wider text-stone-400 mb-1">{label}</span>
      {children}
    </label>
  );
}

const inputClass = "w-full bg-stone-800/60 border border-stone-700 rounded-md px-3 py-2 text-sm text-stone-100 placeholder-stone-500 focus:outline-none focus:ring-2 focus:ring-offset-0 focus:border-transparent transition";

function AIButton({ onClick, loading, label = "Mejorar con IA" }) {
  return (
    <button onClick={onClick} disabled={loading}
      className="inline-flex items-center gap-1.5 text-[11px] font-mono uppercase tracking-wide text-stone-300 hover:text-white disabled:opacity-50 transition mb-1">
      {loading ? <Loader2 size={12} className="animate-spin" /> : <Sparkles size={12} />}
      {loading ? "Puliendo…" : label}
    </button>
  );
}

function TemplateThumb({ id, accent }) {
  const base = "w-full h-full rounded-[2px]";
  if (id === "clasico") return (
    <div className={base + " bg-white p-2 flex flex-col gap-1"}>
      <div className="h-2 w-2/3 rounded-sm" style={{ background: "#333" }} />
      <div className="h-[3px] w-full mb-1" style={{ background: accent }} />
      <div className="h-1 w-full bg-stone-200 rounded-full" />
      <div className="h-1 w-5/6 bg-stone-200 rounded-full" />
      <div className="h-1.5 w-1/2 mt-1 rounded-full" style={{ background: accent, opacity: 0.6 }} />
      <div className="h-1 w-full bg-stone-200 rounded-full" />
      <div className="h-1 w-4/6 bg-stone-200 rounded-full" />
    </div>
  );
  if (id === "moderno") return (
    <div className={base + " bg-white flex overflow-hidden"}>
      <div className="w-[35%] h-full p-1.5 flex flex-col gap-1" style={{ background: "#232323" }}>
        <div className="h-1.5 w-4/5 rounded-full bg-stone-500" />
        <div className="h-1 w-full rounded-full mt-1" style={{ background: accent }} />
        <div className="h-1 w-3/4 rounded-full bg-stone-600" />
        <div className="h-1 w-2/3 rounded-full bg-stone-600" />
      </div>
      <div className="flex-1 p-1.5 flex flex-col gap-1">
        <div className="h-1.5 w-1/2 rounded-full" style={{ background: accent, opacity: 0.7 }} />
        <div className="h-1 w-full bg-stone-200 rounded-full" />
        <div className="h-1 w-5/6 bg-stone-200 rounded-full" />
      </div>
    </div>
  );
  if (id === "minimalista") return (
    <div className={base + " bg-white p-2 flex flex-col items-center gap-1"}>
      <div className="h-2 w-1/2 rounded-sm bg-stone-800" />
      <div className="h-1 w-1/3 rounded-full mb-1" style={{ background: accent }} />
      <div className="h-[1px] w-4/5 bg-stone-200 my-1" />
      <div className="h-1 w-full bg-stone-100 rounded-full" />
      <div className="h-1 w-5/6 bg-stone-100 rounded-full" />
    </div>
  );
  if (id === "ejecutivo") return (
    <div className={base + " bg-white p-2 flex flex-col items-center gap-1"}>
      <div className="h-2 w-1/2 rounded-sm bg-stone-800" />
      <div className="h-1 w-1/3 rounded-full" style={{ background: accent }} />
      <div className="h-[2px] w-full my-1" style={{ background: accent, opacity: 0.4 }} />
      <div className="flex w-full gap-1">
        <div className="w-1/3 flex flex-col gap-1"><div className="h-1 w-full bg-stone-200 rounded-full" /><div className="h-1 w-full bg-stone-200 rounded-full" /></div>
        <div className="w-2/3 flex flex-col gap-1"><div className="h-1 w-full bg-stone-200 rounded-full" /><div className="h-1 w-5/6 bg-stone-200 rounded-full" /></div>
      </div>
    </div>
  );
  if (id === "corporativo") return (
    <div className={base + " bg-white p-2 flex flex-col items-center gap-1"}>
      <div className="h-2 w-1/2 rounded-sm bg-stone-800" />
      <div className="h-1 w-1/3 rounded-full bg-stone-400" />
      <div className="h-[1px] w-full bg-stone-300 my-1" />
      <div className="h-1 w-full bg-stone-200 rounded-full" />
      <div className="h-1 w-5/6 bg-stone-200 rounded-full" />
    </div>
  );
  if (id === "compacto") return (
    <div className={base + " bg-white p-2 flex gap-1.5"}>
      <div className="w-[3px] h-full rounded-full shrink-0" style={{ background: accent, opacity: 0.5 }} />
      <div className="flex-1 flex flex-col gap-1.5 pt-1">
        <div className="h-1 w-4/5 bg-stone-200 rounded-full" />
        <div className="h-1 w-3/5 bg-stone-200 rounded-full" />
        <div className="h-1 w-4/5 bg-stone-200 rounded-full" />
        <div className="h-1 w-1/2 bg-stone-200 rounded-full" />
      </div>
    </div>
  );
  return (
    <div className={base + " bg-white flex flex-col overflow-hidden"}>
      <div className="h-[35%] w-full shrink-0" style={{ background: accent }} />
      <div className="flex-1 p-1.5 flex flex-col gap-1">
        <div className="h-1 w-full bg-stone-200 rounded-full" />
        <div className="h-1 w-5/6 bg-stone-200 rounded-full" />
        <div className="h-1 w-2/3 bg-stone-200 rounded-full" />
      </div>
    </div>
  );
}

function TemplateGallery({ open, onClose, current, accent, onSelect }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-30 bg-black/70 backdrop-blur-sm flex items-center justify-center p-6 no-print">
      <div className="bg-stone-900 border border-stone-800 rounded-lg w-full max-w-2xl p-6 max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-5">
          <div>
            <h2 className="font-display text-xl">Galería de plantillas</h2>
            <p className="text-[12px] text-stone-500 mt-0.5">Elige un diseño. Tu contenido y color de acento se mantienen.</p>
          </div>
          <button onClick={onClose} className="text-stone-500 hover:text-white transition"><X size={20} /></button>
        </div>
        <div className="grid grid-cols-2 gap-4">
          {TEMPLATES.map((t) => (
            <button key={t.id} onClick={() => { onSelect(t.id); onClose(); }}
              className="text-left border rounded-md overflow-hidden transition hover:-translate-y-0.5"
              style={{ borderColor: current === t.id ? accent : "#3f3a35", background: "#1c1a18" }}>
              <div className="h-32 p-3 bg-stone-950"><TemplateThumb id={t.id} accent={accent} /></div>
              <div className="px-3 py-2.5 flex items-center justify-between">
                <div><p className="text-sm font-medium">{t.name}</p><p className="text-[11px] text-stone-500">{t.desc}</p></div>
                {current === t.id && <span className="w-5 h-5 rounded-full flex items-center justify-center shrink-0" style={{ background: accent }}><Check size={12} className="text-stone-950" /></span>}
              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function ContactLine({ data, className, iconSize = 11 }) {
  return (
    <div className={className}>
      {data.email && <span className="flex items-center gap-1"><Mail size={iconSize} /> {data.email}</span>}
      {data.telefono && <span className="flex items-center gap-1"><Phone size={iconSize} /> {data.telefono}</span>}
      {data.ubicacion && <span className="flex items-center gap-1"><MapPin size={iconSize} /> {data.ubicacion}</span>}
      {data.linkedin && <span className="flex items-center gap-1"><Linkedin size={iconSize} /> {data.linkedin}</span>}
    </div>
  );
}

function SkillChips({ data, accent }) {
  return (
    <div className="flex flex-wrap gap-1.5">
      {data.habilidades.split(",").map((h, i) => h.trim() && (
        <span key={i} className="text-[11px] px-2 py-1 rounded-sm" style={{ background: `${accent}18`, color: accent }}>{h.trim()}</span>
      ))}
    </div>
  );
}

function ExperienciaBlock({ data, titleClass }) {
  return data.experiencia.map((exp) => (exp.puesto || exp.empresa) && (
    <div key={exp.id} className="mb-4 last:mb-0">
      <div className="flex items-baseline justify-between gap-2">
        <p className={titleClass}>{exp.puesto}{exp.empresa && <span className="font-sans text-stone-500 text-[13px] font-normal"> · {exp.empresa}</span>}</p>
        <span className="font-mono text-[11px] text-stone-400 whitespace-nowrap">{exp.periodo}</span>
      </div>
      {exp.descripcion && <div className="text-[12.5px] text-stone-600 mt-1 leading-relaxed whitespace-pre-line">{exp.descripcion}</div>}
    </div>
  ));
}

function EducacionBlock({ data }) {
  return data.educacion.map((edu) => (edu.titulo || edu.institucion) && (
    <div key={edu.id} className="mb-2 last:mb-0 flex items-baseline justify-between gap-2">
      <p className="text-[13px] text-stone-800"><span className="font-medium">{edu.titulo}</span>{edu.institucion && <span className="text-stone-500"> · {edu.institucion}</span>}</p>
      <span className="font-mono text-[11px] text-stone-400 whitespace-nowrap">{edu.periodo}</span>
    </div>
  ));
}

function SectionLabel({ children, accent, className = "" }) {
  return <h3 className={"font-mono text-[11px] uppercase tracking-widest mb-2 " + className} style={{ color: accent }}>{children}</h3>;
}

function PreviewClasico({ data, accent }) {
  const hasExp = data.experiencia.some((e) => e.puesto || e.empresa);
  const hasEdu = data.educacion.some((e) => e.titulo || e.institucion);
  return (
    <div className="print-page bg-[#FBF9F5] text-[#232323] w-full max-w-[600px] shadow-2xl px-10 py-12 min-h-[780px]">
      <div className="mb-6 pb-6" style={{ borderBottom: `2px solid ${accent}` }}>
        <h1 className="font-display text-[32px] leading-tight" style={{ color: "#1a1a1a" }}>{data.nombre || "Tu nombre"}</h1>
        {data.puesto && <p className="font-mono text-sm mt-1 tracking-wide" style={{ color: accent }}>{data.puesto}</p>}
        <ContactLine data={data} className="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-[12px] text-stone-600" />
      </div>
      {data.resumen && <div className="mb-6"><SectionLabel accent={accent}>Perfil</SectionLabel><p className="text-[13px] leading-relaxed text-stone-700">{data.resumen}</p></div>}
      {hasExp && <div className="mb-6"><SectionLabel accent={accent} className="mb-3">Experiencia</SectionLabel><ExperienciaBlock data={data} titleClass="font-display text-[15px] font-medium text-stone-900" /></div>}
      {hasEdu && <div className="mb-6"><SectionLabel accent={accent} className="mb-3">Educación</SectionLabel><EducacionBlock data={data} /></div>}
      {data.habilidades && <div><SectionLabel accent={accent}>Habilidades</SectionLabel><SkillChips data={data} accent={accent} /></div>}
    </div>
  );
}

function PreviewModerno({ data, accent }) {
  const hasExp = data.experiencia.some((e) => e.puesto || e.empresa);
  const hasEdu = data.educacion.some((e) => e.titulo || e.institucion);
  return (
    <div className="print-page bg-[#FBF9F5] text-[#232323] w-full max-w-[600px] shadow-2xl min-h-[780px] flex overflow-hidden">
      <div className="w-[34%] bg-[#1c1a18] text-stone-200 px-6 py-10 flex flex-col gap-6">
        <div>
          <h1 className="font-display text-[22px] leading-tight text-white">{data.nombre || "Tu nombre"}</h1>
          {data.puesto && <p className="font-mono text-[11px] mt-1 tracking-wide" style={{ color: accent }}>{data.puesto}</p>}
        </div>
        <ContactLine data={data} className="flex flex-col gap-1.5 text-[11px] text-stone-400" iconSize={10} />
        {hasEdu && <div><SectionLabel accent={accent} className="mb-2">Educación</SectionLabel>
          <div className="flex flex-col gap-2">
            {data.educacion.map((edu) => (edu.titulo || edu.institucion) && (
              <div key={edu.id}><p className="text-[12px] text-stone-200 font-medium">{edu.titulo}</p><p className="text-[11px] text-stone-500">{edu.institucion}</p><p className="text-[10px] font-mono text-stone-600">{edu.periodo}</p></div>
            ))}
          </div></div>}
        {data.habilidades && <div><SectionLabel accent={accent} className="mb-2">Habilidades</SectionLabel>
          <div className="flex flex-wrap gap-1">
            {data.habilidades.split(",").map((h, i) => h.trim() && <span key={i} className="text-[10px] px-2 py-0.5 rounded-sm bg-stone-800 text-stone-300">{h.trim()}</span>)}
          </div></div>}
      </div>
      <div className="flex-1 px-8 py-10">
        {data.resumen && <div className="mb-6"><SectionLabel accent={accent}>Perfil</SectionLabel><p className="text-[13px] leading-relaxed text-stone-700">{data.resumen}</p></div>}
        {hasExp && <div><SectionLabel accent={accent} className="mb-3">Experiencia</SectionLabel><ExperienciaBlock data={data} titleClass="font-display text-[15px] font-medium text-stone-900" /></div>}
      </div>
    </div>
  );
}

function PreviewMinimalista({ data, accent }) {
  const hasExp = data.experiencia.some((e) => e.puesto || e.empresa);
  const hasEdu = data.educacion.some((e) => e.titulo || e.institucion);
  return (
    <div className="print-page bg-white text-[#222] w-full max-w-[600px] shadow-2xl px-12 py-14 min-h-[780px]">
      <div className="text-center mb-8">
        <h1 className="font-display text-[30px] tracking-tight" style={{ color: "#161616" }}>{data.nombre || "Tu nombre"}</h1>
        {data.puesto && <p className="text-[13px] mt-1 tracking-wide" style={{ color: accent }}>{data.puesto}</p>}
        <ContactLine data={data} className="flex flex-wrap justify-center gap-x-4 gap-y-1 mt-3 text-[11px] text-stone-500" iconSize={10} />
      </div>
      {data.resumen && <div className="mb-7 text-center max-w-[440px] mx-auto"><p className="text-[13px] leading-relaxed text-stone-600 italic">{data.resumen}</p></div>}
      {hasExp && <div className="mb-7"><p className="text-[11px] uppercase tracking-[0.25em] text-stone-400 mb-3 text-center">Experiencia</p><ExperienciaBlock data={data} titleClass="text-[14px] font-medium text-stone-900" /></div>}
      {hasEdu && <div className="mb-7"><p className="text-[11px] uppercase tracking-[0.25em] text-stone-400 mb-3 text-center">Educación</p><EducacionBlock data={data} /></div>}
      {data.habilidades && <div className="text-center"><p className="text-[11px] uppercase tracking-[0.25em] text-stone-400 mb-2">Habilidades</p><p className="text-[12.5px] text-stone-600">{data.habilidades}</p></div>}
    </div>
  );
}

function PreviewEjecutivo({ data, accent }) {
  const hasExp = data.experiencia.some((e) => e.puesto || e.empresa);
  const hasEdu = data.educacion.some((e) => e.titulo || e.institucion);
  return (
    <div className="print-page bg-[#FBF9F5] text-[#232323] w-full max-w-[600px] shadow-2xl px-10 py-12 min-h-[780px]">
      <div className="text-center mb-5">
        <h1 className="font-display text-[30px]" style={{ color: "#1a1a1a" }}>{data.nombre || "Tu nombre"}</h1>
        {data.puesto && <p className="font-mono text-[12px] mt-1 tracking-widest uppercase" style={{ color: accent }}>{data.puesto}</p>}
        <ContactLine data={data} className="flex flex-wrap justify-center gap-x-4 gap-y-1 mt-3 text-[12px] text-stone-600" />
      </div>
      <div className="h-[2px] mb-6" style={{ background: accent, opacity: 0.5 }} />

    </div>
  );
}

const TEMPLATE_COMPONENTS = { clasico: PreviewClasico, moderno: PreviewModerno, minimalista: PreviewMinimalista, ejecutivo: PreviewEjecutivo, corporativo: PreviewCorporativo, compacto: PreviewCompacto, creativo: PreviewCreativo };

function InstallButton() {
  const [deferred, setDeferred] = useState(null);
  const [installed, setInstalled] = useState(false);

  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setDeferred(e); };
    const onInstalled = () => setInstalled(true);
    window.addEventListener("beforeinstallprompt", onPrompt);
    window.addEventListener("appinstalled", onInstalled);
    return () => {
      window.removeEventListener("beforeinstallprompt", onPrompt);
      window.removeEventListener("appinstalled", onInstalled);
    };
  }, []);

  if (installed || !deferred) return null;

  return (
    <button
      onClick={async () => { deferred.prompt(); await deferred.userChoice; setDeferred(null); }}
      className="inline-flex items-center gap-2 text-sm font-medium px-3.5 py-2 rounded-md border border-stone-700 text-stone-200 hover:border-stone-500 transition"
    >
      <ArrowDownToLine size={15} /> Instalar app
    </button>
  );
}

function CVBuilder() {
  const [data, setData] = useState(loadInitialState);
  const [loadingField, setLoadingField] = useState(null);
  const [galleryOpen, setGalleryOpen] = useState(false);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }, [data]);

  const update = (patch) => setData((d) => ({ ...d, ...patch }));
  const updateExperience = (id, patch) => setData((d) => ({ ...d, experiencia: d.experiencia.map((e) => (e.id === id ? { ...e, ...patch } : e)) }));
  const updateEducation = (id, patch) => setData((d) => ({ ...d, educacion: d.educacion.map((e) => (e.id === id ? { ...e, ...patch } : e)) }));
  const addExperience = () => setData((d) => ({ ...d, experiencia: [...d.experiencia, emptyExperience()] }));
  const removeExperience = (id) => setData((d) => ({ ...d, experiencia: d.experiencia.filter((e) => e.id !== id) }));
  const addEducation = () => setData((d) => ({ ...d, educacion: [...d.educacion, emptyEducation()] }));
  const removeEducation = (id) => setData((d) => ({ ...d, educacion: d.educacion.filter((e) => e.id !== id) }));

  const improveSummary = async () => {
    if (!data.resumen.trim()) return;
    setLoadingField("resumen");
    try {
      const result = await callClaude(`Reescribe este resumen profesional de un currículum en español, de forma más clara, concisa y profesional. Máximo 3 frases, sin viñetas, sin comillas ni texto extra, responde solo con el resumen mejorado:\n\n"${data.resumen}"`);
      update({ resumen: result.replace(/^"|"$/g, "") });
    } catch (e) { console.error(e); } finally { setLoadingField(null); }
  };

  const improveExperience = async (exp) => {
    if (!exp.descripcion.trim()) return;
    setLoadingField(exp.id);
    try {
      const result = await callClaude(`Reescribe esta descripción de un puesto de trabajo para un currículum en español. Usa viñetas cortas que empiecen con verbos de acción en pasado, orientadas a logros y resultados cuando sea posible. Máximo 3 viñetas, cada una en una línea, sin encabezados ni texto extra. Puesto: "${exp.puesto}" en "${exp.empresa}". Descripción actual:\n\n"${exp.descripcion}"`);
      updateExperience(exp.id, { descripcion: result });
    } catch (e) { console.error(e); } finally { setLoadingField(null); }
  };

  const improveSkills = async () => {
    if (!data.habilidades.trim()) return;
    setLoadingField("habilidades");
    try {
      const result = await callClaude(`Organiza y pule esta lista de habilidades para un currículum en español. Devuelve solo una lista separada por comas, sin encabezados ni texto extra:\n\n"${data.habilidades}"`);
      update({ habilidades: result });
    } catch (e) { console.error(e); } finally { setLoadingField(null); }
  };

  const handlePrint = () => window.print();
  const accent = data.accent;
  const PreviewComponent = TEMPLATE_COMPONENTS[data.template] || PreviewClasico;
  const currentTemplateName = TEMPLATES.find((t) => t.id === data.template)?.name;

  return (
    <div className="min-h-screen bg-stone-950 text-stone-100 font-sans">
      <style>{`input:focus, textarea:focus { border-color: ${accent} !important; box-shadow: 0 0 0 2px ${accent}33; }`}</style>

      <TemplateGallery open={galleryOpen} onClose={() => setGalleryOpen(false)} current={data.template} accent={accent} onSelect={(id) => update({ template: id })} />

      <header className="no-print border-b border-stone-800 px-6 py-4 flex items-center justify-between sticky top-0 bg-stone-950/95 backdrop-blur z-20 flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <div className="w-8 h-8 rounded-sm flex items-center justify-center font-display text-lg" style={{ background: accent }}>CV</div>
          <div>
            <h1 className="font-display text-lg leading-none">Constructor de currículum</h1>
            <p className="text-[11px] font-mono text-stone-500 mt-0.5">editor + vista previa en vivo</p>
          </div>
        </div>
        <div className="flex items-center gap-3 flex-wrap">
          <InstallButton />
          <button onClick={() => setGalleryOpen(true)} className="inline-flex items-center gap-2 text-sm font-medium px-3.5 py-2 rounded-md border border-stone-700 text-stone-200 hover:border-stone-500 transition">
            <LayoutTemplate size={15} /> {currentTemplateName}
          </button>
          <div className="flex items-center gap-1.5">
            {ACCENTS.map((a) => (
              <button key={a.value} onClick={() => update({ accent: a.value })} title={a.name}
                className="w-5 h-5 rounded-full border-2 transition"
                style={{ background: a.value, borderColor: data.accent === a.value ? "white" : "transparent" }} />
            ))}
          </div>
          <button onClick={handlePrint} className="inline-flex items-center gap-2 text-sm font-medium px-4 py-2 rounded-md text-stone-950 transition hover:opacity-90" style={{ background: accent }}>
            <Download size={15} /> Descargar PDF
          </button>
        </div>
      </header>

      <div className="grid grid-cols-1 lg:grid-cols-2">
        <div className="no-print px-6 py-8 max-w-xl mx-auto lg:mx-0 lg:pl-10 w-full">
          <section className="mb-8">
            <h2 className="font-mono text-[11px] uppercase tracking-widest text-stone-500 mb-3 flex items-center gap-2"><span className="w-4 h-px bg-stone-700" /> Datos personales</h2>
            <div className="grid grid-cols-2 gap-x-3">
              <Field label="Nombre completo"><input className={inputClass} value={data.nombre} onChange={(e) => update({ nombre: e.target.value })} placeholder="Ana Torres" /></Field>
              <Field label="Título profesional"><input className={inputClass} value={data.puesto} onChange={(e) => update({ puesto: e.target.value })} placeholder="Diseñadora UX" /></Field>
              <Field label="Email"><input className={inputClass} value={data.email} onChange={(e) => update({ email: e.target.value })} placeholder="ana@correo.com" /></Field>
              <Field label="Teléfono"><input className={inputClass} value={data.telefono} onChange={(e) => update({ telefono: e.target.value })} placeholder="+52 55 1234 5678" /></Field>
              <Field label="Ubicación"><input className={inputClass} value={data.ubicacion} onChange={(e) => update({ ubicacion: e.target.value })} placeholder="Ciudad de México" /></Field>
              <Field label="LinkedIn / portafolio"><input className={inputClass} value={data.linkedin} onChange={(e) => update({ linkedin: e.target.value })} placeholder="linkedin.com/in/ana" /></Field>
            </div>
          </section>

          <section className="mb-8">
            <div className="flex items-center justify-between mb-2">
              <h2 className="font-mono text-[11px] uppercase tracking-widest text-stone-500 flex items-center gap-2"><span className="w-4 h-px bg-stone-700" /> Resumen profesional</h2>
              <AIButton onClick={improveSummary} loading={loadingField === "resumen"} />
            </div>
            <textarea className={inputClass + " min-h-[90px] resize-none"} value={data.resumen} onChange={(e) => update({ resumen: e.target.value })} placeholder="Escribe 2-3 frases sobre tu experiencia y fortalezas..." />
          </section>

          <section className="mb-8">
            <div className="flex items-center justify-between mb-3">
              <h2 className="font-mono text-[11px] uppercase tracking-widest text-stone-500 flex items-center gap-2"><span className="w-4 h-px bg-stone-700" /> Experiencia</h2>
              <button onClick={addExperience} className="text-stone-400 hover:text-white transition" title="Agregar experiencia"><Plus size={16} /></button>
            </div>
            {data.experiencia.map((exp) => (
              <div key={exp.id} className="mb-5 pb-5 border-b border-stone-800 last:border-0">
                <div className="flex items-start gap-2">
                  <GripVertical size={14} className="text-stone-700 mt-2.5 shrink-0" />
                  <div className="flex-1">
                    <div className="grid grid-cols-2 gap-x-3">
                      <Field label="Puesto"><input className={inputClass} value={exp.puesto} onChange={(e) => updateExperience(exp.id, { puesto: e.target.value })} placeholder="Desarrolladora backend" /></Field>
                      <Field label="Empresa"><input className={inputClass} value={exp.empresa} onChange={(e) => updateExperience(exp.id, { empresa: e.target.value })} placeholder="Acme Inc." /></Field>
                    </div>
                    <Field label="Periodo"><input className={inputClass} value={exp.periodo} onChange={(e) => updateExperience(exp.id, { periodo: e.target.value })} placeholder="Ene 2022 — Presente" /></Field>
                    <div className="flex items-center justify-between mb-1">
                      <span className="block text-[11px] font-mono uppercase tracking-wider text-stone-400">Descripción</span>
                      <AIButton onClick={() => improveExperience(exp)} loading={loadingField === exp.id} />
                    </div>
                    <textarea className={inputClass + " min-h-[80px] resize-none"} value={exp.descripcion} onChange={(e) => updateExperience(exp.id, { descripcion: e.target.value })} placeholder="Responsabilidades y logros principales..." />
                  </div>
                  {data.experiencia.length > 1 && <button onClick={() => removeExperience(exp.id)} className="text-stone-600 hover:text-red-400 transition mt-2.5"><Trash2 size={14} /></button>}
                </div>
              </div>
            ))}
          </section>

          <section className="mb-8">
            <div className="flex items-center justify-between mb-3">
              <h2 className="font-mono text-[11px] uppercase tracking-widest text-stone-500 flex items-center gap-2"><span className="w-4 h-px bg-stone-700" /> Educación</h2>
              <button onClick={addEducation} className="text-stone-400 hover:text-white transition" title="Agregar educación"><Plus size={16} /></button>
            </div>
            {data.educacion.map((edu) => (
              <div key={edu.id} className="mb-4 flex items-start gap-2">
                <div className="flex-1">
                  <Field label="Título / carrera"><input className={inputClass} value={edu.titulo} onChange={(e) => updateEducation(edu.id, { titulo: e.target.value })} placeholder="Lic. en Sistemas Computacionales" /></Field>
                  <div className="grid grid-cols-2 gap-x-3">
                    <Field label="Institución"><input className={inputClass} value={edu.institucion} onChange={(e) => updateEducation(edu.id, { institucion: e.target.value })} placeholder="UNAM" /></Field>
                    <Field label="Periodo"><input className={inputClass} value={edu.periodo} onChange={(e) => updateEducation(edu.id, { periodo: e.target.value })} placeholder="2018 — 2022" /></Field>
                  </div>
                </div>
                {data.educacion.length > 1 && <button onClick={() => removeEducation(edu.id)} className="text-stone-600 hover:text-red-400 transition mt-6"><Trash2 size={14} /></button>}
              </div>
            ))}
          </section>

          <section>
            <div className="flex items-center justify-between mb-2">
              <h2 className="font-mono text-[11px] uppercase tracking-widest text-stone-500 flex items-center gap-2"><span className="w-4 h-px bg-stone-700" /> Habilidades</h2>
              <AIButton onClick={improveSkills} loading={loadingField === "habilidades"} />
            </div>
            <textarea className={inputClass + " min-h-[60px] resize-none"} value={data.habilidades} onChange={(e) => update({ habilidades: e.target.value })} placeholder="Python, gestión de equipos, SQL, comunicación..." />
          </section>
        </div>

        <div className="bg-stone-900 px-6 py-8 flex justify-center print:bg-white print:p-0">
          <div className="w-full flex justify-center"><PreviewComponent data={data} accent={accent} /></div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CVBuilder />);
</script>

    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((err) => {
        console.warn("No se pudo registrar el service worker:", err);
      });
    });
  }
</script>
